name: MERN CD Pipeline - Docker Hub & Google Cloud Run

on:
  push:
    branches: [ main ]

# Ensure only one deployment runs at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-push-deploy:
    name: Build Docker Images, Push to Docker Hub, Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------
      # 1. Authenticate with Docker Hub
      # ----------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------
      # 2. Build & Push Backend Docker Image
      # ----------------------------------------------------
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------
      # 3. Authenticate with Google Cloud Platform
      # ----------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # ----------------------------------------------------
      # 4. Deploy Backend to Google Cloud Run
      # ----------------------------------------------------
      - name: Deploy Backend Service to Cloud Run
        id: deploy-backend
        run: |
          gcloud run deploy mern-blog-backend \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:latest \
            --region ${{ secrets.GCP_REGION || 'us-central1' }} \
            --platform managed \
            --allow-unauthenticated \
            --port 5000 \
            --set-env-vars MONGO_URI="${{ secrets.MONGO_URI }}",NODE_ENV=production,PORT=5000,CORS_ORIGIN="*"

          # Retrieve deployed backend URL
          BACKEND_URL=$(gcloud run services describe mern-blog-backend \
            --platform managed \
            --region ${{ secrets.GCP_REGION || 'us-central1' }} \
            --format 'value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Backend successfully deployed at: $BACKEND_URL"

      # ----------------------------------------------------
      # 5. Build & Push Frontend Docker Image (Using Backend URL)
      # ----------------------------------------------------
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=${{ steps.deploy-backend.outputs.BACKEND_URL }}/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------
      # 6. Deploy Frontend to Google Cloud Run
      # ----------------------------------------------------
      - name: Deploy Frontend Service to Cloud Run
        id: deploy-frontend
        run: |
          gcloud run deploy mern-blog-frontend \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:latest \
            --region ${{ secrets.GCP_REGION || 'us-central1' }} \
            --platform managed \
            --allow-unauthenticated \
            --port 80

          FRONTEND_URL=$(gcloud run services describe mern-blog-frontend \
            --platform managed \
            --region ${{ secrets.GCP_REGION || 'us-central1' }} \
            --format 'value(status.url)')
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "Frontend successfully deployed at: $FRONTEND_URL"

      # ----------------------------------------------------
      # 7. Deployment Summary
      # ----------------------------------------------------
      - name: Publish Deployment Summary
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Run Public URL | Image Tag |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | [${{ steps.deploy-frontend.outputs.FRONTEND_URL }}](${{ steps.deploy-frontend.outputs.FRONTEND_URL }}) | \`${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | [${{ steps.deploy-backend.outputs.BACKEND_URL }}/health](${{ steps.deploy-backend.outputs.BACKEND_URL }}/health) | \`${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:latest\` |" >> $GITHUB_STEP_SUMMARY
