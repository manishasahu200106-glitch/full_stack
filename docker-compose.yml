services:
  # ==========================================
  # Service 1: MongoDB Database Service
  # ==========================================
  mongo:
    image: mongo:7.0
    container_name: mern-blog-mongodb
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: blogdb
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # Service 2: Express & Node.js Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern-blog-backend
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/blogdb
      - CORS_ORIGIN=http://localhost:3000,http://localhost
    ports:
      - "5000:5000"
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Service 3: React & Vite Frontend (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: mern-blog-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - mern-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Service 4: Cloudflare Public Tunnel (Global 24/7 HTTPS Access)
  # ==========================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mern-blog-tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://frontend:80
    networks:
      - mern-network
    depends_on:
      - frontend

# ==========================================
# Named Volumes & Custom Bridge Network
# ==========================================
volumes:
  mongo-data:
    driver: local

networks:
  mern-network:
    driver: bridge
